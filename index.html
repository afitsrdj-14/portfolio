/* ─── Cinema Reel Component ─────────────────────────────────────── */
function CinemaReel({ mode, slides, withModal, onExplore }) {
  const N = slides.length;
  if (N === 0) return <div style={{ padding: 40 }}>No projects found.</div>;

  const isSticky = mode === 'sticky';
  const TOTAL = N;
  const wrapperRef = useRef(null);
  const secRef = useRef(null), trackRef = useRef(null);
  const outerRefs = useRef([]), imgRefs = useRef([]), contentRefs = useRef([]);
  const idxR = useRef(0), prevR = useRef(0);
  const yR = useRef(0), tgtR = useRef(0), wTs = useRef(0);
  const dragR = useRef({ active: false, sy: 0, st: 0, delta: 0 });
  const onSec = useRef(false);
  
  const [activeIdx, setActiveIdx] = useState(0);
  const [openSlide, setOpenSlide] = useState(null);

  const layR = useRef(null);

  const getLay = useCallback(() => {
    const vh = isSticky ? window.innerHeight : (secRef.current ? secRef.current.clientHeight : window.innerHeight);
    let slideH = vh * 0.80;
    let pitch = vh * 0.85;
    let topPad = vh * 0.10;
    if (outerRefs.current[0]) {
       slideH = outerRefs.current[0].clientHeight;
       const mb = parseFloat(window.getComputedStyle(outerRefs.current[0]).marginBottom) || (vh * 0.05);
       pitch = slideH + mb;
       topPad = (vh - slideH) / 2;
    }
    return { vh, pitch, slideH, topPad };
  }, [isSticky]);

  const setIdx = useCallback((next) => {
    const clampedNext = Math.max(0, Math.min(N - 1, next));
    if (clampedNext === idxR.current) return;
    prevR.current = idxR.current; idxR.current = clampedNext;
    tgtR.current = layR.current.topPad - clampedNext * layR.current.pitch;
    setActiveIdx(clampedNext);
  }, [N]);

  useEffect(() => {
    layR.current = getLay();
    yR.current = layR.current.topPad; tgtR.current = layR.current.topPad;
    
    let raf, autoTs = null;
    function runAuto(ts) {
      if (!autoTs) autoTs = ts;
      const el = ts - autoTs;
      const fp = 1 - Math.pow(1 - Math.min(el / 1000, 1), 2);
      for (let i = 0; i < TOTAL; i++) { if (outerRefs.current[i]) outerRefs.current[i].style.opacity = fp; }
      if (el < 1000) raf = requestAnimationFrame(runAuto);
      else raf = requestAnimationFrame(tick);
    }

    function tick() {
      const now = performance.now();
      if (!dragR.current.active && now - wTs.current > 100) {
        const dy = tgtR.current - yR.current;
        yR.current = Math.abs(dy) < 0.5 ? tgtR.current : yR.current + dy * 0.11;
      }
      if (trackRef.current) trackRef.current.style.transform = `translate3d(0,${yR.current}px,0)`;
      
      const { pitch, slideH, vh } = layR.current, vc = vh / 2;
      for (let i = 0; i < TOTAL; i++) {
        const top = i * pitch + yR.current, sc = top + slideH / 2, dy = sc - vc, dn = Math.abs(dy) / slideH;
        if (imgRefs.current[i]) imgRefs.current[i].style.transform = `translate3d(0,${(-dy / 1.2).toFixed(2)}px,0)`;
        const c = contentRefs.current[i]; if (!c) continue;
        if (dn > 2) { c.style.opacity = "0"; c.style.filter = "blur(16px)"; c.style.transform = ""; continue; }
        
        const isA = i === idxR.current, isL = i === prevR.current && prevR.current !== idxR.current;
        let op = 0, bl = 16, cy = 0;
        if (isA) { const t = Math.max(0, Math.min(1, 1 - dn / 0.55)); op = t*t*(3-2*t); bl = (1 - op) * 14; cy = (1 - op) * 64 * Math.sign(dy || 1); }
        else if (isL) { const f = Math.max(0, 1 - Math.max(0, dn - 0.6) / 0.6); op = f; bl = (1 - f) * 6; cy = -dy * 0.42; }
        c.style.opacity = op.toFixed(3); c.style.filter = `blur(${bl.toFixed(2)}px)`; c.style.transform = `translate3d(0,${cy.toFixed(2)}px,0)`;
      }
      raf = requestAnimationFrame(tick);
    }

    raf = requestAnimationFrame(runAuto);
    const sec = secRef.current; if (!sec) return;

    if (isSticky) {
      const onS = () => {
        if (!wrapperRef.current) return;
        const rect = wrapperRef.current.getBoundingClientRect();
        const maxS = (N - 1) * window.innerHeight;
        const s = Math.max(0, Math.min(maxS, -rect.top));
        const prog = maxS === 0 ? 0 : s / maxS;
        tgtR.current = layR.current.topPad - prog * ((N - 1) * layR.current.pitch);
        const nr = Math.round(prog * (N - 1));
        if (nr !== idxR.current) { prevR.current = idxR.current; idxR.current = nr; setActiveIdx(nr); }
      };
      window.addEventListener("scroll", onS);
      onS(); // init
      return () => { cancelAnimationFrame(raf); window.removeEventListener("scroll", onS); };
    } else {
      const onW = e => {
        if (!onSec.current || e.target?.closest("[data-nodrag]")) return;
        const delta = Math.max(-200, Math.min(200, e.deltaY));
        if (idxR.current === 0 && delta < 0) return;
        if (idxR.current === N - 1 && delta > 0) return;
        e.preventDefault();
        yR.current -= delta; wTs.current = performance.now();
        const nr = Math.round((layR.current.topPad - yR.current) / layR.current.pitch);
        if (nr !== idxR.current) setIdx(nr);
      };
      sec.addEventListener("wheel", onW, { passive: false });
      sec.addEventListener("pointerenter", () => onSec.current = true);
      sec.addEventListener("pointerleave", () => onSec.current = false);
      return () => { cancelAnimationFrame(raf); sec.removeEventListener("wheel", onW); };
    }

function FadeIn({ children, delay = 0 }) {
  const ref = useRef();
  useEffect(() => {
    const observer = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { e.target.style.opacity = 1; e.target.style.transform = 'translateY(0)'; }
    }, { threshold: 0.1 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return <div ref={ref} style={{ opacity: 0, transform: 'translateY(40px)', transition: `all 0.8s cubic-bezier(0.22,1,0.36,1) ${delay}ms` }}>{children}</div>;
}

function ContactCard({ icon, value, link }) {
  return (
    <a href={link} target="_blank" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px', width: 220, height: 200, background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.05)', borderRadius: 32, textDecoration: 'none', transition: 'all 0.3s' }} onMouseEnter={e => {e.currentTarget.style.background='rgba(255,255,255,0.05)'; e.currentTarget.style.transform='translateY(-5px)'; e.currentTarget.firstChild.style.color='#fff';}} onMouseLeave={e => {e.currentTarget.style.background='rgba(255,255,255,0.02)'; e.currentTarget.style.transform='translateY(0)'; e.currentTarget.firstChild.style.color='rgba(255,255,255,0.4)';}}>
      <div style={{ marginBottom: 20, color: 'rgba(255,255,255,0.4)', transition: 'color 0.3s' }}>{icon}</div>
      <span style={{ fontSize: 14, fontWeight: 600, color: '#fff', textAlign: 'center' }}>{value}</span>
    </a>
  )
}

function Contact() {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: '#0a0908' }}>
       <div style={{ flex: 1, paddingTop: 120, paddingBottom: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
         <h1 style={{ fontSize: 'clamp(4rem, 8vw, 7rem)', fontWeight: 800, letterSpacing: '-0.04em', marginBottom: 20 }}>Hit me up!</h1>
         <p style={{ fontSize: '1.2rem', color: 'rgba(255,255,255,0.5)', marginBottom: 80 }}>Ready to start your next project? Let's connect below.</p>
         <div style={{ display: 'flex', gap: 30, flexWrap: 'wrap', justifyContent: 'center', maxWidth: 1000 }}>
            <ContactCard icon={Icons.email} value="afit14.as@gmail.com" link="mailto:afit14.as@gmail.com" />
            <ContactCard icon={Icons.linkedin} value="Afit Suradiradja" link="https://www.linkedin.com/in/afit-suradiradja/" />
            <ContactCard icon={Icons.instagram} value="@afitsrdj" link="https://www.instagram.com/afitsrdj" />
            <ContactCard icon={Icons.youtube} value="Afit Studio" link="https://youtube.com" />
         </div>
       </div>
       <MiniFooter />

function FilterItem({ active, onClick, label, icon }) {
  return (
    <div 
      onClick={onClick}
      style={{ 
        fontSize: "clamp(14px, 2vw, 20px)", whiteSpace: "nowrap", fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 14,
        opacity: active ? 1 : 0.3, transform: active ? 'translateX(10px)' : 'translateX(0px)',
        transition: 'all 0.3s ease', letterSpacing: '-0.02em'
      }}
      onMouseEnter={e => e.currentTarget.style.opacity = 1}
      onMouseLeave={e => { if(!active) e.currentTarget.style.opacity = 0.3 }}
    >
      {icon} {label}
    </div>
  )
}

function Projects({ filter, setFilter }) {
  const filtered = PORTFOLIO_ITEMS.filter(p => filter === 'all' || p.type === filter);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    setLoading(true);
    const t = setTimeout(() => setLoading(false), 800);
    return () => clearTimeout(t);
  }, [filter]);

  return (
    <div className="proj-wrapper" style={{ display: 'flex', height: '100vh', width: '100%', background: '#0a0908' }}>
      <div className="proj-sidebar" style={{ display: 'flex', gap: 24, zIndex: 10 }}>
         <h2 style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.2em', opacity: 0.4, marginBottom: 10 }}>FILTER PROJECTS</h2>
         <FilterItem active={filter==='all'} onClick={()=>setFilter('all')} label="All Work" icon={Icons.grid} />
         <FilterItem active={filter==='vfx'} onClick={()=>setFilter('vfx')} label="VFX" icon={Icons.vfx} />
         <FilterItem active={filter==='3d'} onClick={()=>setFilter('3d')} label="3D Art" icon={Icons.art3d} />
         <FilterItem active={filter==='motion'} onClick={()=>setFilter('motion')} label="Motion" icon={Icons.motion} />
      </div>
      <div style={{ flex: 1, position: 'relative', height: '100vh' }}>
         {loading && (
           <div style={{ position: 'absolute', inset: 0, zIndex: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0a0908' }}>
             <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.4em', color: 'rgba(255,255,255,0.5)', animation: 'pulse 1.5s infinite' }}>
               LOADING REEL...
             </div>
           </div>
         )}
         <div style={{ opacity: loading ? 0 : 1, transition: 'opacity 0.6s ease', height: '100%', width: '100%' }}>
            <CinemaReel key={filter} mode="interactive" slides={filtered} withModal={true} />
         </div>
      </div>
    </div>
  );
}

function App() {
  const [route, setRoute] = useState('home');
  const [filter, setFilter] = useState('all');

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [route]);

  const goToProjects = (type) => {
    setFilter(type);
    setRoute('projects');
  };

  return (
    <>
      <Navbar route={route} setRoute={setRoute} />
      {route === 'home' && <Home goToProjects={goToProjects} />}
      {route === 'projects' && <Projects filter={filter} setFilter={setFilter} />}
      {route === 'about' && <About />}
      {route === 'contact' && <Contact />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
