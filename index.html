/* ─── LazyVideo Component ──────────────────────────────────────── */
/* Uses IntersectionObserver to lazy-load video src only when the
   element scrolls into view. Shows a shimmer placeholder until the
   video can play. Pauses and unloads when out of viewport. */
function LazyVideo({ src, style, className, autoPlay = true, loop = true, muted = true, playsInline = true, ...rest }) {
  const videoRef = useRef(null);
  const wrapperRef = useRef(null);
  const [loaded, setLoaded] = useState(false);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const el = wrapperRef.current;
    if (!el || !src) return;

    const observer = new IntersectionObserver(
      ([entry]) => {
        setInView(entry.isIntersecting);
      },
      { threshold: 0.15, rootMargin: '200px 0px' }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, [src]);

  // Set/unset src based on viewport visibility
  useEffect(() => {
    const vid = videoRef.current;
    if (!vid || !src) return;

    if (inView) {
      if (!vid.src || vid.src !== src) {
        vid.src = src;
        vid.load();
      }
      vid.play().catch(() => {});
    } else {
      vid.pause();
    }
  }, [inView, src]);

  const handleCanPlay = () => setLoaded(true);

  // Reset loaded state when src changes
  useEffect(() => { setLoaded(false); }, [src]);

  if (!src) return null;

  return (
    <div ref={wrapperRef} className={className} style={{ position: 'relative', ...style }}>
      {/* Shimmer placeholder — fades out once video is playable */}
      <div className="video-shimmer" style={{ opacity: loaded ? 0 : 1, pointerEvents: 'none' }} />
      <video
        ref={videoRef}
        onCanPlay={handleCanPlay}
        autoPlay={autoPlay}
        loop={loop}
        muted={muted}
        playsInline={playsInline}
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: loaded ? 1 : 0, transition: 'opacity 0.6s ease' }}
        {...rest}
      />
    </div>
  );
}

/* ─── Cinema Reel Component ─────────────────────────────────────── */
function CinemaReel({ mode, slides, withModal, onExplore }) {
  const N = slides.length;
  if (N === 0) return <div style={{ padding: 40 }}>No projects found.</div>;

  const isSticky = mode === 'sticky';
  const TOTAL = N;
  const wrapperRef = useRef(null);
  const secRef = useRef(null), trackRef = useRef(null);
  const outerRefs = useRef([]), imgRefs = useRef([]), contentRefs = useRef([]);
  const idxR = useRef(0), prevR = useRef(0);
  const yR = useRef(0), tgtR = useRef(0), wTs = useRef(0);
  const dragR = useRef({ active: false, sy: 0, st: 0, delta: 0 });
  const onSec = useRef(false);
  
  const [activeIdx, setActiveIdx] = useState(0);
  const [openSlide, setOpenSlide] = useState(null);

  const layR = useRef(null);

  const getLay = useCallback(() => {
    const vh = isSticky ? window.innerHeight : (secRef.current ? secRef.current.clientHeight : window.innerHeight);
    let slideH = vh * 0.80;
    let pitch = vh * 0.85;
    let topPad = vh * 0.10;
    if (outerRefs.current[0]) {
       slideH = outerRefs.current[0].clientHeight;
       const mb = parseFloat(window.getComputedStyle(outerRefs.current[0]).marginBottom) || (vh * 0.05);
       pitch = slideH + mb;
       topPad = (vh - slideH) / 2;
    }
    return { vh, pitch, slideH, topPad };
  }, [isSticky]);

  const setIdx = useCallback((next) => {
    const clampedNext = Math.max(0, Math.min(N - 1, next));
    if (clampedNext === idxR.current) return;
    if (isSticky && wrapperRef.current) {
      const rect = wrapperRef.current.getBoundingClientRect();
      const offset = window.scrollY + rect.top + (clampedNext * window.innerHeight);
      window.scrollTo({ top: offset, behavior: 'smooth' });
    } else {
      prevR.current = idxR.current; idxR.current = clampedNext;
      tgtR.current = layR.current.topPad - clampedNext * layR.current.pitch;
      setActiveIdx(clampedNext);
    }
  }, [N, isSticky]);

  useEffect(() => {
    layR.current = getLay();
    yR.current = layR.current.topPad; tgtR.current = layR.current.topPad;
    
    let raf, autoTs = null;
    function runAuto(ts) {
      if (!autoTs) autoTs = ts;
      const el = ts - autoTs;
      const fp = 1 - Math.pow(1 - Math.min(el / 1000, 1), 2);
      for (let i = 0; i < TOTAL; i++) { if (outerRefs.current[i]) outerRefs.current[i].style.opacity = fp; }
      if (el < 1000) raf = requestAnimationFrame(runAuto);
      else raf = requestAnimationFrame(tick);
    }

    function tick() {
      const now = performance.now();
      if (!dragR.current.active && now - wTs.current > 100) {
        const dy = tgtR.current - yR.current;
        yR.current = Math.abs(dy) < 0.5 ? tgtR.current : yR.current + dy * 0.11;
      }
      if (trackRef.current) trackRef.current.style.transform = `translate3d(0,${yR.current}px,0)`;
      
      const { pitch, slideH, vh } = layR.current, vc = vh / 2;
      for (let i = 0; i < TOTAL; i++) {
        const top = i * pitch + yR.current, sc = top + slideH / 2, dy = sc - vc, dn = Math.abs(dy) / slideH;
        if (imgRefs.current[i]) imgRefs.current[i].style.transform = `translate3d(0,${(-dy / 1.2).toFixed(2)}px,0)`;
        const c = contentRefs.current[i]; if (!c) continue;
        if (dn > 2) { c.style.opacity = "0"; c.style.filter = "blur(16px)"; c.style.transform = ""; continue; }
        
        const isA = i === idxR.current, isL = i === prevR.current && prevR.current !== idxR.current;
        let op = 0, bl = 16, cy = 0;
        if (isA) { const t = Math.max(0, Math.min(1, 1 - dn / 0.55)); op = t*t*(3-2*t); bl = (1 - op) * 14; cy = (1 - op) * 64 * Math.sign(dy || 1); }
        else if (isL) { const f = Math.max(0, 1 - Math.max(0, dn - 0.6) / 0.6); op = f; bl = (1 - f) * 6; cy = -dy * 0.42; }
        c.style.opacity = op.toFixed(3); c.style.filter = `blur(${bl.toFixed(2)}px)`; c.style.transform = `translate3d(0,${cy.toFixed(2)}px,0)`;
      }
      raf = requestAnimationFrame(tick);
    }

    raf = requestAnimationFrame(runAuto);
    const sec = secRef.current; if (!sec) return;

    if (isSticky) {
      const onS = () => {
        if (!wrapperRef.current) return;
        const rect = wrapperRef.current.getBoundingClientRect();
        const maxS = (N - 1) * window.innerHeight;
        const s = Math.max(0, Math.min(maxS, -rect.top));
        const prog = maxS === 0 ? 0 : s / maxS;
        tgtR.current = layR.current.topPad - prog * ((N - 1) * layR.current.pitch);
        const nr = Math.round(prog * (N - 1));
        if (nr !== idxR.current) { prevR.current = idxR.current; idxR.current = nr; setActiveIdx(nr); }
      };
      window.addEventListener("scroll", onS);
      onS(); // init
      return () => { cancelAnimationFrame(raf); window.removeEventListener("scroll", onS); };
    } else {
      const onW = e => {
        if (!onSec.current || e.target?.closest("[data-nodrag]")) return;
        const delta = Math.max(-200, Math.min(200, e.deltaY));
        if (idxR.current === 0 && delta < 0) return;
        if (idxR.current === N - 1 && delta > 0) return;
        e.preventDefault();
        yR.current -= delta; wTs.current = performance.now();
        const nr = Math.round((layR.current.topPad - yR.current) / layR.current.pitch);
        if (nr !== idxR.current) setIdx(nr);
      };
      sec.addEventListener("wheel", onW, { passive: false });
      sec.addEventListener("pointerenter", () => onSec.current = true);
      sec.addEventListener("pointerleave", () => onSec.current = false);
      return () => { cancelAnimationFrame(raf); sec.removeEventListener("wheel", onW); };
    }

function FadeIn({ children, delay = 0 }) {
  const ref = useRef();
  useEffect(() => {
    const observer = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { e.target.style.opacity = 1; e.target.style.transform = 'translateY(0)'; }
    }, { threshold: 0.1 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return <div ref={ref} style={{ opacity: 0, transform: 'translateY(40px)', transition: `all 0.8s cubic-bezier(0.22,1,0.36,1) ${delay}ms` }}>{children}</div>;
}

               <div>
                 <label style={{ fontSize: 10, textTransform: 'uppercase', color: 'rgba(255,255,255,0.4)', fontWeight: 700, letterSpacing: '0.1em' }}>YouTube URL</label>
                 <input value={contactData.youtubeUrl} onChange={e => setContactData({...contactData, youtubeUrl: e.target.value})} style={{ width: '100%', padding: 12, marginTop: 6, background: 'rgba(0,0,0,0.2)', color: '#fff', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 8, outline: 'none' }} />
               </div>
             </div>
           </div>
         </div>
       )}
    </div>
  );
}

function App() {
  const [route, setRoute] = useState('home');
  const [filter, setFilter] = useState('all');

  useEffect(() => {
    if (window.location.search.includes('admin') && route === 'home') {
      setRoute('admin');
    }
    window.scrollTo(0, 0);
  }, [route]);

  const goToProjects = (type) => {
    setFilter(type);
    setRoute('projects');
  };

  return (
    <>
      {route !== 'admin' && <Navbar route={route} setRoute={setRoute} />}
      {route === 'home' && <Home goToProjects={goToProjects} setRoute={setRoute} />}
      {route === 'projects' && <Projects filter={filter} setFilter={setFilter} />}
      {route === 'about' && <About />}
      {route === 'contact' && <Contact />}
      {route === 'admin' && <AdminPanel />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
